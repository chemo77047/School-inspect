name: Scrape inspections

on:
  schedule:
    # GitHub cron is UTC and ignores daylight saving, so all four candidate hours are
    # listed and the "gate" job below drops the two that are wrong for the current
    # offset. Net effect: exactly two runs a day, 10:00 and 16:00 Central, year round.
    # An hour earlier than the 11:00/17:00 the data is wanted by, because GitHub's
    # shared scheduler starts these runs 1-3 hours late.
    - cron: "0 15 * * *"   # 10:00 CDT
    - cron: "0 16 * * *"   # 10:00 CST
    - cron: "0 21 * * *"   # 16:00 CDT
    - cron: "0 22 * * *"   # 16:00 CST
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back to re-scrape"
        default: "14"

concurrency:
  group: scrape
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.slot.outputs.run }}
    steps:
      - id: slot
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          # Match on the cron that triggered the run, never on the current clock:
          # GitHub starts scheduled runs late, sometimes by hours, and a clock check
          # would skip every delayed run.
          if [ "$(TZ=America/Chicago date +%z)" = "-0500" ]; then
            morning="0 15 * * *"; evening="0 21 * * *"   # CDT
          else
            morning="0 16 * * *"; evening="0 22 * * *"   # CST
          fi
          if [ "$EVENT" != "schedule" ] || [ "$SCHEDULE" = "$morning" ] \
             || [ "$SCHEDULE" = "$evening" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "cron '$SCHEDULE' belongs to the other DST offset; skipping"
          fi

  scrape:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python update_inspections.py --days ${{ github.event.inputs.days || 14 }}

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inspections.json inspections.csv
          git diff --cached --quiet && echo "no new inspections" && exit 0
          git commit -m "Update inspections ($(date -u +%Y-%m-%d\ %H:%M) UTC)"
          git push
