name: Scrape inspections

on:
  schedule:
    # GitHub cron is UTC and ignores daylight saving, so all four candidate hours are
    # listed and the "gate" job below drops the two that are wrong for the current
    # offset. Net effect: exactly two runs a day, 11:00 and 17:00 Central, year round.
    - cron: "0 16 * * *"   # 11:00 CDT
    - cron: "0 17 * * *"   # 11:00 CST
    - cron: "0 22 * * *"   # 17:00 CDT
    - cron: "0 23 * * *"   # 17:00 CST
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back to re-scrape"
        default: "10"

concurrency:
  group: scrape
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.slot.outputs.run }}
    steps:
      - id: slot
        run: |
          hour=$(TZ=America/Chicago date +%-H)
          if [ "${{ github.event_name }}" != "schedule" ] \
             || [ "$hour" = "11" ] || [ "$hour" = "17" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "${hour}:00 Central is not a scheduled slot; skipping"
          fi

  scrape:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python update_inspections.py --days ${{ github.event.inputs.days || 10 }}

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inspections.json inspections.csv
          git diff --cached --quiet && echo "no new inspections" && exit 0
          git commit -m "Update inspections ($(date -u +%Y-%m-%d\ %H:%M) UTC)"
          git push
